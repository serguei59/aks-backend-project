name: CI-CD AKS

on:
  push:
    branches:
      - feature/k8s_api-mysql
      - main

jobs:
  build-image-front:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # allowing push inside GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


  deploy-to-aks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-actions@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Streamlit image
        run: |
          cd front
          docker build -t ghcr.io/${{ github.repository_owner }}/streamlit-front:latest .

      - name: Push Streamlit image
        run : |
          docker push ghcr.io/${{ github.repository_owner }}//streamlit-front:latest


      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}   # service principal JSON

      - name: Bootstrap AKS infra (RG, AKS, namespace, ingress)
        run: |
          bash ./scripts/aks_bootstrap.sh
      
      - name: kubectl apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend/configmap.yaml -n sbuasa
          kubectl apply -f k8s/backend/secret.yaml -n sbuasa
          kubectl apply -f k8s/backend/pvc.yaml -n sbuasa
          kubectl apply -f k8s/backend/db-deployment.yaml -n sbuasa
          kubectl apply -f k8s/backend/db-service.yaml -n sbuasa
          kubectl apply -f k8s/backend/api-deployment.yaml -n sbuasa
          kubectl apply -f k8s/backend/api-service.yaml -n sbuasa
          kubectl apply -f k8s/front/front-deployment.yaml -n sbuasa
          kubectl apply -f k8s/front/front-service.yaml -n sbuasa
          kubectl apply -f k8s/network/ingress.yaml -n sbuasa
