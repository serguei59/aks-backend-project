name: CI-CD AKS

on:
  push:
    branches:
      - feature/k8s_api-mysql
      - main

jobs:

  build-image-front:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # nécessaire pour push dans GHCR

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4 

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Streamlit image
        run: |
          cd front
          docker build -t ghcr.io/${{ github.repository_owner }}/streamlit-front:latest .

      - name: Push Streamlit image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/streamlit-front:latest


  deploy-to-aks:
    runs-on: ubuntu-latest
    needs: build-image-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Bootstrap AKS infra (RG, AKS, namespace, ingress)
        run: |
          bash ./scripts/aks_bootstrap.sh

      - name: Apply Kubernetes manifests + update ConfigMap dynamically
        run: |
          # Déploiement backend
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend/configmap.yaml -n sbuasa
          kubectl apply -f k8s/backend/secret.yaml -n sbuasa
          kubectl apply -f k8s/backend/pvc.yaml -n sbuasa
          kubectl apply -f k8s/backend/db-deployment.yaml -n sbuasa
          kubectl apply -f k8s/backend/db-service.yaml -n sbuasa
          kubectl apply -f k8s/backend/api-deployment.yaml -n sbuasa
          kubectl apply -f k8s/backend/api-service.yaml -n sbuasa

          # Secret GHCR pour le pull AKS
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            -n sbuasa \
            --dry-run=client -o yaml | kubectl apply -f -

          # Déploiement front + ingress
          kubectl apply -f k8s/front/front-configmap.yaml -n sbuasa
          kubectl apply -f k8s/front/front-deployment.yaml -n sbuasa
          kubectl apply -f k8s/front/front-service.yaml -n sbuasa
          kubectl apply -f k8s/network/ingress.yaml -n sbuasa

          # === Récupération de l'External IP du ingress (après bootstrap) ===
          echo "Waiting for external IP..."
          sleep 15

          # On récupère l'IP du service ingress-nginx-controller
          EXTERNAL_IP=""
          for i in {1..40}; do
            EXTERNAL_IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [[ -n "$EXTERNAL_IP" && "$EXTERNAL_IP" != "null" ]]; then
              echo "✔ EXTERNAL_IP = $EXTERNAL_IP"
              break
            fi
            echo "… waiting for LB IP (attempt $i/40)"
            sleep 10
          done

          if [[ -z "$EXTERNAL_IP" ]]; then
            echo "❌ Could not get external IP for ingress-nginx-controller."
            kubectl get svc ingress-nginx-controller -n ingress-nginx -o yaml
            exit 1
          fi

          # === Patch du host dans l'Ingress front ===
          kubectl patch ingress front-ingress -n sbuasa \
            --type='json' \
            -p="[
                {
                  \"op\": \"replace\",
                  \"path\": \"/spec/rules/0/host\",
                  \"value\": \"${EXTERNAL_IP}.nip.io\"
                }
              ]"

              
          # Restart du front pour qu'il recharge la config
          kubectl rollout restart deployment streamlit -n sbuasa

          # Afficher url finale
          echo "Front URL : http://${EXTERNAL_IP}.nip.io"
