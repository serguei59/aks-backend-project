apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: sbuasa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: sengsathit/brief-mysql:latest
          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-configmap
                  key: database_name

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user-password

            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          volumeMounts:
            - name: mysql-volume
              mountPath: /var/lib/mysql

      volumes:
        - name: mysql-volume
          persistentVolumeClaim:
            claimName: mysql-pvc
