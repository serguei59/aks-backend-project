apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: front-ingress
  namespace: sbuasa
  annotations:
    # Pour éviter les erreurs de redirection Streamlit
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /

spec:
  ingressClassName: nginx
  rules:
    - host: placeholder.nip.io
      http:
        paths:
          # ------- FRONT STREAMLIT ------
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-service
                port:
                  number: 8501

        # 2) Fallback si l’utilisateur tape directement l’IP brute (http://YOUR_IP)
    - host: ""
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: front-service
                port:
                  number: 8501