apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbuasa-ingress
  namespace: sbuasa
  annotations:
    # Réécriture du chemin pour l'API
    nginx.ingress.kubernetes.io/rewrite-target: /$1

    # Pour éviter les erreurs de redirection Streamlit
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  ingressName: nginx
  rules:
    - host: sbuasa.local    # facultatif
      http:
        paths:
          # API Back end
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000

          # Front Streamlit
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: streamlit
                port:
                  number: 8501
