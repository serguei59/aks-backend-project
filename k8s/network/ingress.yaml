apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbuasa-ingress
  namespace: sbuasa
  annotations:
    kubernetes.io/ingress.class: nginx

    # Réécriture du chemin pour l'API
    nginx.ingress.kubernetes.io/rewrite-target: /$1

    # Pour éviter les erreurs de redirection Streamlit
    nginx.ingress.kubernetes.io/ssl-redirect: "false"

spec:
  rules:
    - host: sbuasa.local    # tu peux mettre n’importe quel host ou le retirer
      http:
        paths:
          # API Flask
          - path: /api/?(.*)
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 5000

          # Front Streamlit
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: streamlit
                port:
                  number: 8501
